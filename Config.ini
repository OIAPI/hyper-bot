
[app]
debug = true




# http 本地打开的端口，如需外网可将 127.0.0.1 替换为 0.0.0.0
[http]
port = 8008
host = 127.0.0.1

# cq api 地址
[cq]
api = http://music.play.oiapi.net
auth = auth123

# 初始化的权限，每次启动都会设置一次
[permission]
super = [2354452553, 2579988698]

# Redis 设置
[Redis]
host = 127.0.0.1
port = 6379
auth = 123456789
select = 7

# Git设置
[github]
# localPath = 
# username = 
# password = 


# 订阅消息类型
[type]
message = true
notice = true
request = true
meta_event = true


# 接收消息的类型 group/private/all 群/好友/所有
[message]
type = group

# 处理一些系统消息
[notice]
group_decrease = 1
group_increase = 1
