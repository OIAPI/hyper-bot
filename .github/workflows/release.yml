name: release

# 普通 push 只同步源码，不编译、不打包、不发 Release。
# 发布 = 推送版本 tag（如 v3.3.9），工作流自动构建、打 tag、发 Release。
# 也保留手动触发作为兜底：Actions → release → Run workflow。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: ver
        run: |
          V=$(tr -d ' \r\n' < VERSION)
          if [ -z "$V" ]; then echo "VERSION 为空"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Check tag matches VERSION
        if: github.event_name == 'push'
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.ver.outputs.version }}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 VERSION v${{ steps.ver.outputs.version }} 不一致" >&2
            exit 1
          fi

      - name: Check release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.ver.outputs.tag }} 已发布，跳过"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.rel.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build webUI
        if: steps.rel.outputs.exists == 'false'
        working-directory: ui
        run: |
          npm install --no-audit --no-fund
          npm run build
          ls -la ../public/webui | head -5

      - name: Commit built assets & push tag
        if: steps.rel.outputs.exists == 'false'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/webui
          if git diff --cached --quiet; then
            echo "webUI 产物无变化，只补 tag"
          else
            git commit -m "chore(webui): 重新构建前端产物 ($TAG) [skip ci]"
          fi
          # 分支和 tag 必须放进同一次 push：先推分支、紧接着单独推 tag，会撞上
          # GitHub 多副本的同步延迟，报 "missing necessary objects"（v3.2.12 就是
          # 这么失败的）。这里每轮先 rebase 再重建 tag，失败 5 次才放弃。
          for i in 1 2 3 4 5; do
            git fetch origin main --quiet
            git rebase origin/main || { git rebase --abort; exit 1; }
            git tag -f -a "$TAG" -m "release $TAG"
            if git push origin HEAD:main "refs/tags/$TAG"; then
              echo "分支与 tag 已推送（$TAG）"
              exit 0
            fi
            echo "推送失败（第 $i 次），5 秒后重试…"
            sleep 5
          done
          echo "产物/tag 推送失败（远端在此期间有更新）" >&2
          exit 1

      - name: Setup PHP
        if: steps.rel.outputs.exists == 'false'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, json, zip, openssl
          tools: composer

      - name: Install composer deps
        if: steps.rel.outputs.exists == 'false'
        run: |
          # composer.lock 里的 dist 地址是国内镜像，Actions 机器拉不到；
          # 删掉 lock 让 composer 按 composer.json 从上游重新解析（打包用，不影响仓库）
          rm -f composer.lock
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress --ignore-platform-reqs

      - name: Package
        if: steps.rel.outputs.exists == 'false'
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist runtime/log runtime/store runtime/webui runtime/github runtime/schedule runtime/update
          zip -qr "dist/hyper-bot-v$V.zip" . -x ".git/*" -x "node_modules/*" -x "ui/node_modules/*" -x "dist/*" -x "*.DS_Store"
          ( cd dist && sha256sum "hyper-bot-v$V.zip" > "hyper-bot-v$V.zip.sha256" )
          ls -lh dist
          unzip -l "dist/hyper-bot-v$V.zip" | tail -1

      - name: Publish release
        if: steps.rel.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release create "${{ steps.ver.outputs.tag }}" "dist/hyper-bot-v$V.zip" "dist/hyper-bot-v$V.zip.sha256" --title "v$V" --notes "自动构建自 ${{ github.sha }}：包含 vendor 与前端产物，解压后执行 php bin/hyper install 与 php bin/hyper serve。runtime/ 与 Config.ini 不会被覆盖，升级前请备份。"
