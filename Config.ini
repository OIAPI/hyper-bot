
[app]
debug = true
; 时区（留空则用 PHP 默认）。影响日志时间与群管理里的时间显示。
timezone = Asia/Shanghai




; http 本地打开的端口，如需外网可将 127.0.0.1 替换为 0.0.0.0
[http]
port = 8008
host = 127.0.0.1

; cq api 地址
[cq]
api = http://music.play.oiapi.net
auth = auth123

; 初始化的权限，每次启动都会设置一次
[permission]
super = [2354452553, 2579988698]

; Redis 设置
[Redis]
host = 127.0.0.1
port = 6379
auth = 123456789
select = 7

; Git设置
[github]
; localPath = 
; username = 
; password = 


; 订阅消息类型
[type]
message = true
notice = true
request = true
meta_event = true


; 接收消息的类型 group/private/all 群/好友/所有
[message]
type = group

; 处理一些系统消息
[notice]
group_decrease = 1
group_increase = 1
; 戳一戳
; poke = 1

; ==================== 协议接入配置 ====================
; 事件处理默认回落到 HTTP 协议端（与原有行为一致）
[protocol]
; 事件来源对应的后端（http/onebot/milky/qqbot），仅作说明用途
default = http

; ---------- OneBot11 WebSocket ----------
[protocol.onebot]
enable = false
; 正向 WS：本框架主动连接 OneBot 实现端
forward.enable = false
forward.url = ws://127.0.0.1:3001
forward.token =
; 反向 WS：OneBot 实现端连接本框架（ws://<host>:<port>/onebot/v11/ws）
reverse.enable = false
reverse.path = /onebot/v11/ws
reverse.token =
; 机器人自身的 QQ 号（可选，留空则从事件里的 self_id 自动学习）
self_id =

; ---------- Milky ----------
[protocol.milky]
enable = false
; 协议端 HTTP API 地址（Milky 协议端开启的 HTTP 服务）
api = http://127.0.0.1:3010
token =
timeout = 30
; 事件接入方式：webhook / ws / sse
event.mode = webhook
; WebHook 端点（配合协议端配置的 webhook 地址 http://<host>:<port>/api/protocol/milky/webhook）
webhook.path = /api/protocol/milky/webhook
; WS/SSE 地址（留空则从 api 推导）
ws.url =
sse.url =
; 本框架对外提供 Milky WS 服务时的路径（可选）
ws.server_path = /milky/event

; ---------- QQ 官方机器人 ----------
[protocol.qqbot]
enable = false
app_id =
client_secret =
; 自定义 self_id（留空则由 app_id 派生一个稳定哈希，便于插件区分机器人）
; 官方 OpenAPI 域名（默认 https://api.bot.qq.com，沙箱/代理可改）
api = https://api.bot.qq.com
token_url = https://api.bot.qq.com/app/getAppAccessToken
; 事件接入方式：webhook / ws
event.mode = ws
; Webhook 端点（需在 QQ 机器人管理端配置为 https://<公网域名>/api/protocol/qqbot/webhook）
webhook.path = /api/protocol/qqbot/webhook
; 是否强制校验 webhook 签名
webhook.verify = true
; intents：支持整数或事件名（逗号分隔），如 GROUP_AND_C2C_EVENT,GROUP_MEMBER_EVENT
; 默认 1<<25 | 1<<24（群与单聊事件 + 群成员事件）
intents =
gateway.shard = false
gateway.shard_id = 0
gateway.shard_count = 1
gateway.resume = true

[runtime]
; 运行架构：swoole（默认，常驻协程 + 反向 WS）/ php（内置服务器，无需扩展）/ webui（只跑面板）
; 默认 swoole；没装 ext-swoole 会自动降级为 php，并在启动日志里说明
arch = swoole
