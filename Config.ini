
[app]
debug = true
; 时区（留空则用 PHP 默认）。影响日志时间与群管理里的时间显示。
timezone = Asia/Shanghai




; http 本地打开的端口，如需外网可将 127.0.0.1 替换为 0.0.0.0
[http]
port = 8008
host = 127.0.0.1

; 单个 HTTP 请求体的上限（字节），默认 8MB。
; 只对 swoole 架构生效：Swoole 自己解析 HTTP，PHP 的 upload_max_filesize /
; post_max_size 在这里不起作用，超限表现为连接被断开（反代日志 104/502）。
; 面板更新包走 512KB 分片，不依赖它；导入大插件包时才需要调大。
; 改完必须重启 php bin/hyper serve（reload 不会重新设置 server options）。
package_max_length = 8388608

; v1 的 [cq]（第三方音乐接口）已移除，本框架不再调用任何外部 CQ 接口


; 初始化的权限，每次启动都会设置一次
[permission]
super = [2354452553, 2579988698]

; WebUI 面板
[webui]
; 登录会话存哪里：file（默认，推荐）| store（跟业务缓存共用）
; 用 store 时 Redis 一重启/一降级，旧 token 就查不到，表现为「莫名被踢下线」，
; 所以默认放本地文件；多机共享会话时才改成 store。
session_store = file

; 更新包分片大小（字节），默认 512 KB。
; 更新走「分片上传 → 后台解压」，单请求很小；但如果反代把 client_max_body_size
; 限制得比 512k 还低（例如 100k），就把这里调小到 65536。范围 64KB–4MB。
; update_chunk = 524288

; Redis 设置
; 填错密码/库号不会让面板崩，但会静默回退文件存储 —— 用 php bin/hyper redis 逐步排查
; KeyDB 与 Redis 协议兼容，可直接用；注意启动参数是 --requirepass <密码>
[Redis]
host = 127.0.0.1
port = 6379
auth = 123456789
select = 7

; Git设置
[github]
; localPath = 
; username = 
; password = 


; 订阅消息类型
[type]
message = true
notice = true
request = true
meta_event = true


; 接收消息的类型 group/private/all 群/好友/所有
[message]
type = group

; 处理一些系统消息
[notice]
group_decrease = 1
group_increase = 1
; 戳一戳
; poke = 1

; ==================== 协议接入配置 ====================
; 事件处理默认回落到 HTTP 协议端（与原有行为一致）
[protocol]
; 事件来源对应的后端（http/onebot/milky/qqbot），仅作说明用途
default = http

; ---------- OneBot11 WebSocket ----------
[protocol.onebot]
enable = false
; 正向 WS：本框架主动连接 OneBot 实现端
forward.enable = false
forward.url = ws://127.0.0.1:3001
forward.token =
; 反向 WS：OneBot 实现端连接本框架（ws://<host>:<port>/onebot/v11/ws）
; 注意：只有这里设为 true（或配置了 Milky WS 服务端）时，进程才会启动 WebSocket 服务端；
; 保持 false 时端口上根本不监听 WS，实现端连过来会直接被拒绝，也不会刷日志。
reverse.enable = false
reverse.path = /onebot/v11/ws
reverse.token =
; 机器人自身的 QQ 号（可选，留空则从事件里的 self_id 自动学习）
self_id =
; OneBot HTTP API 地址：发送消息 / 拉群列表都走这里
; 实现端（NapCat、Lagrange、go-cqhttp 等）开了 HTTP 服务就填它的地址；只用 WS 时可留空
api = http://127.0.0.1:3001
token =

; ---------- Milky ----------
[protocol.milky]
enable = false
; 协议端 HTTP API 地址（Milky 协议端开启的 HTTP 服务）
api = http://127.0.0.1:3010
token =
timeout = 30
; 事件接入方式：webhook / ws / sse
event.mode = webhook
; WebHook 端点（配合协议端配置的 webhook 地址 http://<host>:<port>/api/protocol/milky/webhook）
webhook.path = /api/protocol/milky/webhook
; WS/SSE 地址（留空则从 api 推导）
ws.url =
sse.url =
; 本框架对外提供 Milky WS 服务时的路径（可选）
ws.server_path = /milky/event

; ---------- QQ 官方机器人 ----------
[protocol.qqbot]
enable = false
app_id =
client_secret =
; 自定义 self_id（留空则由 app_id 派生一个稳定哈希，便于插件区分机器人）
; API 域名已固定：生产 api.bot.qq.com / 沙箱 sandbox.api.sgroup.qq.com
; 沙箱开关在「机器人账号」页编辑官方机器人时选择，这里不再配置 api/token_url
; 事件接入方式：webhook / ws
event.mode = ws
; Webhook 端点（需在 QQ 机器人管理端配置为 https://<公网域名>/api/protocol/qqbot/webhook）
webhook.path = /api/protocol/qqbot/webhook
; 是否强制校验 webhook 签名
webhook.verify = true
; intents：支持整数或事件名（逗号分隔），如 GROUP_AND_C2C_EVENT,GROUP_MEMBER_EVENT
; 默认 1<<25 | 1<<24（群与单聊事件 + 群成员事件）
intents =
gateway.shard = false
gateway.shard_id = 0
gateway.shard_count = 1
gateway.resume = true

[store]
; 固定数据存储：auto / redis / file / memory / mysql / pgsql / sqlite / pdo
; auto 时若填了 dsn 则用数据库，否则沿用 Redis→文件探测。
driver = auto
; MySQL 示例：dsn = "mysql:host=127.0.0.1;port=3306;dbname=hyper;charset=utf8mb4"
; PgSQL 示例：dsn = "pgsql:host=127.0.0.1;port=5432;dbname=hyper"
; 也可以不写 dsn，用下面四项由框架拼装
; host = 127.0.0.1
; port = 3306
; database = hyper
; user = hyper
; password =
; prefix = hyper_
; 可选：数据库做持久层，Redis 只做读缓存
; cache = redis
; cache_ttl = 30

[runtime]
; 运行架构：swoole（默认，常驻协程 + 反向 WS）/ php（内置服务器，无需扩展）/ webui（只跑面板）
; 默认 swoole；没装 ext-swoole 会自动降级为 php，并在启动日志里说明
arch = swoole